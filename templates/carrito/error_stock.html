{% extends 'base.html' %}
{% load static %}

{% block title %}Sin stock | Forrajería Rox{% endblock %}

{% block content %}

<div class="pagina-estado">

    <div class="check">
        <div class="icono error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        <h2>No hay stock suficiente</h2>
        <p class="check-sub">No alcanza stock de <strong>{{ producto.nombre }}</strong></p>
    </div>

    <a href="{% url 'ver_carrito' %}" class="btn btn-carrito">
        🛒 Volver al carrito
    </a>

</div>

{% endblock %}
